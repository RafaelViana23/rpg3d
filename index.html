<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GBA — Character Ground</title>
    <style>
      .file-warning { min-height: 100vh; display: none; place-items: center; padding: 24px; background: #0d0f10; color: #f4f4f2; font-family: Inter, system-ui, sans-serif; }
      .file-warning div { max-width: 560px; padding: 32px; border: 1px solid #34383a; border-radius: 18px; background: #151719; box-shadow: 0 24px 70px #0008; }
      .file-warning small { color: #a5aaad; font-weight: 700; letter-spacing: .16em; }
      .file-warning h1 { margin: 10px 0; font: 600 32px Georgia, serif; }
      .file-warning p { color: #b8bdbf; line-height: 1.6; }
      .file-warning code { color: #fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="file-warning" id="file-warning">
      <div>
        <small>GBA · CHARACTER GROUND</small>
        <h1>Abra pelo servidor local</h1>
        <p>Esta cena 3D não funciona abrindo o arquivo HTML diretamente. No Terminal, dentro da pasta do projeto, execute <code>npm run dev</code> e abra o endereço mostrado.</p>
      </div>
    </div>
    <script>
      if (location.protocol === 'file:') document.getElementById('file-warning').style.display = 'grid';
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
