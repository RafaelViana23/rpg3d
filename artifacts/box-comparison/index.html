<header><h1>Caixa — original × código</h1><p>Mesma escala, câmera e iluminação. Protótipo isolado; as caixas do jogo continuam originais.</p></header><main><article><h2>Modelo atual (GLB)</h2><canvas id="original"></canvas><pre id="original-metrics">Carregando…</pre></article><article><h2>Protótipo em código</h2><canvas id="prototype"></canvas><pre id="prototype-metrics">Carregando…</pre></article></main><footer><button id="view">Alternar vista frontal / perspectiva</button> <span id="result"></span></footer>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {applyCityWood,CITY_WOOD_MATERIAL} from '/src/editor/CityWood.ts';import {createComparisonBox} from './box-prototype.ts';
const original=(await new GLTFLoader().loadAsync('/models/city/props/box-low-poly.glb')).scene;applyCityWood(original,'box-low-poly');
const scenes=[];
function setup(id,model){
 model.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(model),size=bounds.getSize(new T.Vector3());
 const wrap=new T.Group();wrap.add(model);model.position.sub(bounds.getCenter(new T.Vector3()));wrap.scale.setScalar(1/size.y);

 const canvas=document.getElementById(id),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
 const camera=new T.PerspectiveCamera(35,canvas.clientWidth/canvas.clientHeight,.01,20);camera.position.set(1.8,1.2,2.8);camera.lookAt(0,0,0);
 const stats={triangles:0,vertices:0,meshes:0,materials:new Set(),textures:new Set(),geometryBytes:0};model.traverse(o=>{if(!o.isMesh)return;stats.meshes++;stats.triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;stats.vertices+=o.geometry.attributes.position.count;stats.geometryBytes+=Object.values(o.geometry.attributes).reduce((sum,a)=>sum+a.array.byteLength,0)+(o.geometry.index?.array.byteLength??0);for(const m of Array.isArray(o.material)?o.material:[o.material]){stats.materials.add(m.uuid);for(const v of Object.values(m))if(v?.isTexture)stats.textures.add(v.uuid);}});
 renderer.render(scene,camera);renderer.shadowMap.autoUpdate=false;renderer.render(scene,camera);document.getElementById(id+'-metrics').textContent=`Triângulos: ${stats.triangles}\nVértices: ${stats.vertices}\nMalhas: ${stats.meshes} · Materiais: ${stats.materials.size}\nChamadas de desenho medidas: ${renderer.info.render.calls}\nTexturas do modelo: ${stats.textures.size}\nBuffers de geometria: ${(stats.geometryBytes/1024).toFixed(2)} KiB`;
 scenes.push({renderer,scene,camera});return stats;
}
const a=setup('original',original),b=setup('prototype',createComparisonBox());document.getElementById('result').textContent=b.triangles<a.triangles?`${(100*(1-b.triangles/a.triangles)).toFixed(1)}% menos triângulos`:`${(100*(b.triangles/a.triangles-1)).toFixed(1)}% mais triângulos`;
