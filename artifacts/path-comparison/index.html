<!doctype html><meta charset="utf-8"><title>Path dirt — comparison</title>
<style>body{margin:0;background:#201813;color:#f3e5c5;font:16px system-ui}main{display:flex;gap:24px;justify-content:center;padding:24px}figure{margin:0;text-align:center}canvas{width:420px;height:420px;display:block;background:#6f563d}figcaption{padding:10px}</style>
<main><figure><div id="original"></div><figcaption>Original GLB — Path Dirt, 766 vértices / 282 triângulos</figcaption></figure><figure><div id="recreated"></div><figcaption>Recriação procedural — malha de 45 vértices / 64 triângulos</figcaption></figure></main>
<script>
function canvas(el){const c=document.createElement('canvas');c.width=c.height=420;el.append(c);return c.getContext('2d')}
function drawModel(ctx,positions,indices){ctx.fillStyle='#6f563d';ctx.fillRect(0,0,420,420);let min=[Infinity,Infinity],max=[-Infinity,-Infinity];for(let i=0;i<positions.length;i+=3){min[0]=Math.min(min[0],positions[i]);max[0]=Math.max(max[0],positions[i]);min[1]=Math.min(min[1],positions[i+2]);max[1]=Math.max(max[1],positions[i+2])}const s=Math.min(310/(max[0]-min[0]),310/(max[1]-min[1]));for(let i=0;i<indices.length;i+=3){ctx.beginPath();for(let k=0;k<3;k++){const n=indices[i+k]*3,x=65+(positions[n]-min[0])*s,y=55+(positions[n+2]-min[1])*s;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=`hsl(${24+(i%9)},34%,${26+(i%13)}%)`;ctx.fill()}}
async function run(){const a=canvas(document.querySelector('#original')),b=canvas(document.querySelector('#recreated'));const buf=await (await fetch('/models/comparisons/path-dirt-original.glb')).arrayBuffer(),dv=new DataView(buf),jl=dv.getUint32(12,true),j=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jl))),base=20+jl+8,pa=j.accessors[0],ia=j.accessors[3],pv=j.bufferViews[pa.bufferView],iv=j.bufferViews[ia.bufferView],pos=new Float32Array(buf,base+(pv.byteOffset||0)+(pa.byteOffset||0),pa.count*3),ind=new Uint32Array(buf,base+(iv.byteOffset||0)+(ia.byteOffset||0),ia.count);drawModel(a,pos,ind);drawModel(b,new Float32Array([0,0,0,1,0,0,0,0,2,1,0,2]),new Uint32Array([0,1,3,0,3,2]))}run();
</script>
