<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Comparação de portas</title><style>body{margin:0;background:#201b17;color:#f4eadb;font:13px system-ui;display:flex;flex-direction:column;align-items:center}h1{margin:10px;font-size:20px}.row{display:flex;gap:4px;flex-wrap:nowrap;justify-content:center}.card{background:#302820;border:1px solid #80684c;border-radius:8px;padding:5px;text-align:center;width:184px}.card div{height:32px;margin-bottom:4px;color:#f0c98e;font-size:12px}.view{width:174px;height:280px;display:block}small{color:#cdbda8;font-size:10px}</style></head>
<body><h1>Porta das casas — comparação</h1><div class="row"><section class="card"><div>Referência aprovada</div><canvas id="old" class="view"></canvas><small>village-door.glb</small></section><section class="card"><div>Recriação procedural — ainda não aplicada</div><canvas id="new" class="view"></canvas><small>Vigas recuadas e argola paralela à porta</small></section></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createCityVillageDoor} from '/src/editor/CityChurchDoor.ts';
function show(canvas,make){const r=new THREE.WebGLRenderer({canvas,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(174,280,false);r.setClearColor(0x211b17);const s=new THREE.Scene();const c=new THREE.PerspectiveCamera(28,.621,.1,100);c.position.set(4.6,2.8,8);c.lookAt(0,1.7,0);s.add(new THREE.HemisphereLight(0xffe8c0,0x33281e,2));const l=new THREE.DirectionalLight(0xffd7a0,3);l.position.set(3,6,5);s.add(l);const g=new THREE.Group();g.position.y=.05;s.add(g);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,32),new THREE.MeshLambertMaterial({color:0x5b4632}));floor.rotation.x=-Math.PI/2;s.add(floor);Promise.resolve(make()).then(model=>{const b=new THREE.Box3().setFromObject(model),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());model.scale.setScalar(3.4/Math.max(.001,size.y));model.position.set(-center.x*model.scale.x,-b.min.y*model.scale.y,-center.z*model.scale.z);g.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}})});function frame(t){g.rotation.y=Math.sin(t*.00035)*.28;r.render(s,c);requestAnimationFrame(frame)}requestAnimationFrame(frame)}
const houseDoor=()=>new GLTFLoader().loadAsync('/models/city/props/village-door.glb').then(x=>x.scene);show(document.querySelector('#old'),houseDoor);show(document.querySelector('#new'),createCityVillageDoor);
</script></body></html>
