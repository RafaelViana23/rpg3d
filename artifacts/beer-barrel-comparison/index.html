<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barril de cerveja deitado</title><style>body{background:#171a19;color:#eee8da;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#30382f;border-radius:10px;overflow:hidden}canvas{width:100%;height:400px;display:block}h2,pre{padding:16px}pre{white-space:pre-wrap}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>Barril de cerveja deitado — original × código</h1><p>Mesma câmera e iluminação. Modelo novo aplicado no jogo e também no balcão da pousada.</p><main><article><h2>Modelo atual</h2><canvas id="original"></canvas><pre id="original-metrics"></pre></article><article><h2>Protótipo em código</h2><canvas id="prototype"></canvas><pre id="prototype-metrics"></pre></article></main><p id="result"></p><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {applyCityWood} from '/src/editor/CityWood.ts';import {createComparisonBeerBarrel} from './barrel-prototype.ts';
const gltf=await new GLTFLoader().loadAsync('/models/city/props/tavern-interior.glb');applyCityWood(gltf.scene,'tavern-interior');gltf.scene.updateMatrixWorld(true);const source=gltf.scene.getObjectByName('barrelCrane'),original=new T.Group();source.traverse(o=>{if(o.isMesh)original.add(new T.Mesh(o.geometry.clone().applyMatrix4(o.matrixWorld),o.material));});
function show(id,model){const bounds=new T.Box3().setFromObject(model),wrap=new T.Group();wrap.add(model);model.position.sub(bounds.getCenter(new T.Vector3()));wrap.scale.setScalar(1/bounds.getSize(new T.Vector3()).y);const scene=new T.Scene();scene.background=new T.Color('#353b35');scene.add(wrap,new T.HemisphereLight('#fff4dd','#4d4133',2.2));const sun=new T.DirectionalLight('#fff1d9',3);sun.position.set(-2,4,5);scene.add(sun);const c=document.getElementById(id),r=new T.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(c.clientWidth,c.clientHeight,false);r.setPixelRatio(Math.min(devicePixelRatio,2));r.toneMapping=T.ACESFilmicToneMapping;const pmrem=new T.PMREMGenerator(r),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.45;room.dispose();pmrem.dispose();const camera=new T.PerspectiveCamera(35,c.clientWidth/c.clientHeight,.01,30);camera.position.set(1.7,1.3,3.7);camera.lookAt(0,0,0);r.render(scene,camera);let triangles=0,bytes=0;model.traverse(o=>{if(!o.isMesh)return;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;bytes+=Object.values(o.geometry.attributes).reduce((s,a)=>s+a.array.byteLength,0)+(o.geometry.index?.array.byteLength??0);});document.getElementById(id+'-metrics').textContent=`Triângulos: ${triangles}\nChamadas de desenho: ${r.info.render.calls}\nGeometria: ${(bytes/1024).toFixed(2)} KiB`;return triangles;}const a=show('original',original),b=show('prototype',createComparisonBeerBarrel());document.getElementById('result').textContent=`${(100*(1-b/a)).toFixed(1)}% menos triângulos`;
</script></html>
