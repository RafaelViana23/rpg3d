<!doctype html><html><head><meta charset="utf-8"><title>Assets medievais — prévia</title></head><body style="margin:0;background:#aab8c5;font:16px sans-serif"><div style="position:absolute;top:12px;left:12px;z-index:2"><select id="model"><option value="generated-inn">Pousada</option><option value="generated-warehouse">Armazém</option><option value="generated-house">Réplica casa</option><option value="generated-church">Réplica igreja</option><option value="generated-market">Réplica mercado</option></select><button id="turn">Girar 90°</button><span id="status"></span></div><script type="module">
import * as T from 'three';import {createMedievalBuilding} from './src/editor/MedievalBuildings.ts';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor(0xaab8c5);document.body.append(renderer.domElement);renderer.outputColorSpace=T.SRGBColorSpace;const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x666158,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(40,60,30);scene.add(sun);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,10000);const controls=new OrbitControls(camera,renderer.domElement);let model;async function load(){document.querySelector('#status').textContent='Carregando';if(model)scene.remove(model);const selected=document.querySelector('#model').value;const g={scene:createMedievalBuilding(selected.slice(10))};model=g.scene;model.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(model),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());model.position.sub(center);const max=Math.max(size.x,size.y,size.z);camera.position.set(max*.9,max*.65,max*1.1);camera.near=max/1000;camera.far=max*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);scene.add(model);document.querySelector('#status').textContent=` ${size.toArray().map(n=>n.toFixed(1)).join(' × ')}`;controls.update();}document.querySelector('#model').onchange=load;document.querySelector('#turn').onclick=()=>{model.rotation.y+=Math.PI/2;};load();renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
